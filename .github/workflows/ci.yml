# SafeWalk CI.
#
# The test job matters more than it looks. The suite is dependency-free so it can be run anywhere,
# but on the machine it is developed on there is no Node at all — it has only ever been run through
# a browser shim that fakes require(). This is the first place it runs the way the README says to
# run it, so it also checks that the CommonJS export block still works.
#
# permissions.test.js is deliberately NOT run here: it talks to the live Supabase project, and a
# test that hits production on every push is a bad idea however read-only it is.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pure maths tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The client files are classic browser scripts, so they are compiled the way a browser would
      # rather than as modules. This exists because a line-based edit swallowed a closing brace on
      # 2026-09-07 and would have shipped an app.js that did not parse at all — every geometry
      # function undefined, on a safety map. The test suite could not have caught it: it requires
      # geo.js directly and never loads app.js.
      # Verified by deliberately breaking it, not by watching it pass: on a throwaway branch the
      # forEach brace was removed again and this step reported
      #   "SYNTAX ERROR in safewalk-app/app.js: missing ) after argument list"
      # exit 1, the geo suite never ran, and the deploy job was skipped. A guard nobody has watched
      # fail is not yet a guard.
      - name: Check every client script parses
        run: |
          for f in safewalk-app/geo.js safewalk-app/app.js safewalk-app/config.js safewalk-app/sw.js; do
            node -e "
              const fs = require('fs'), vm = require('vm');
              try { new vm.Script(fs.readFileSync('$f', 'utf8'), { filename: '$f' }); }
              catch (e) { console.error('SYNTAX ERROR in $f:', e.message); process.exit(1); }
              console.log('$f parses');
            "
          done
      - name: Run the geo suite
        run: node tests/geo.test.js

  deploy:
    name: Publish to GitHub Pages
    # Publishing was opt-in behind a DEPLOY_PAGES variable until the owner turned Pages on
    # themselves (2026-09-07), which is the consent that gate existed to wait for. Now every push
    # to main publishes. Only safewalk-app/ ships — backend/ and tests/ stay out of the web root.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Only the client ships. backend/ holds SQL migrations and the edge function; tests/ and
      # server.ps1 are development tooling. None of them belong on a public web root.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: safewalk-app
      - id: deployment
        uses: actions/deploy-pages@v4
